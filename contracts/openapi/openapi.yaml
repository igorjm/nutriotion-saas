openapi: 3.1.0
info:
  title: Nutrition Platform API
  version: 0.1.0
  description: Versioned REST contract for the Brazil-first nutrition practice platform.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Acquisition
  - name: Identity
  - name: Patients
  - name: Clinical Records
  - name: Patient Invitations
paths:
  /api/v1/public/early-access:
    post:
      tags: [Acquisition]
      operationId: requestEarlyAccess
      summary: Register a professional for founder-led early access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EarlyAccessRequest'
      responses:
        '201':
          description: Interest registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarlyAccessResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/me/context:
    get:
      tags: [Identity]
      operationId: getSessionContext
      summary: Resolve the authenticated user and active organization membership
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resolved session context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}:
    get:
      tags: [Patients]
      operationId: getPatientSummary
      summary: Return a patient only when the authenticated membership has a relationship
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization-scoped patient summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List patients within the authenticated professional's resolved Organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization-scoped patient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientListItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/clinical-record:
    get:
      tags: [Clinical Records]
      operationId: getPatientClinicalRecord
      summary: Return the active Organization-scoped Patient 360 clinical record
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '200':
          description: Patient record with intake and latest consultation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientClinicalRecord'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/intake:
    put:
      tags: [Clinical Records]
      operationId: updatePatientIntake
      summary: Create or update the active care relationship intake record
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientIntakeRequest'
      responses:
        '200':
          description: Updated intake record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientIntakeRecord'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/consultations:
    post:
      tags: [Clinical Records]
      operationId: startPatientConsultation
      summary: Start or return the current in-progress consultation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
      responses:
        '201':
          description: Consultation workspace started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationWorkspace'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/consultations/{consultationId}/note:
    put:
      tags: [Clinical Records]
      operationId: saveClinicalNoteDraft
      summary: Autosave the mutable draft of a consultation note
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/ConsultationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClinicalNoteRequest'
      responses:
        '200':
          description: Autosaved consultation workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationWorkspace'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/consultations/{consultationId}/finalize:
    post:
      tags: [Clinical Records]
      operationId: finalizeClinicalNote
      summary: Finalize the current draft as an immutable clinical note version
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Finalized consultation workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationWorkspace'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}/consultations/{consultationId}/amendments:
    post:
      tags: [Clinical Records]
      operationId: startClinicalNoteAmendment
      summary: Create a new draft version linked to a finalized note
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/ConsultationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAmendmentRequest'
      responses:
        '201':
          description: Amendment draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationWorkspace'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/patient-invitations:
    post:
      tags: [Patient Invitations]
      operationId: createPatientInvitation
      summary: Create an Organization-scoped patient invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientInvitationRequest'
      responses:
        '201':
          description: Invitation created; the raw capability token is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/public/patient-invitations/{token}:
    get:
      tags: [Patient Invitations]
      operationId: getPatientInvitationPreview
      summary: Preview a patient invitation without exposing its full email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationPreview'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patient-invitations/{token}/accept:
    post:
      tags: [Patient Invitations]
      operationId: acceptPatientInvitation
      summary: Accept an invitation using the authenticated patient's verified email
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInvitationAcceptanceRequest'
      responses:
        '200':
          description: Care relationship activated and consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationAcceptanceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: consultationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EarlyAccessRequest:
      type: object
      additionalProperties: false
      required: [name, email, currentTool, source, marketingConsent, consentTextVersion]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        currentTool:
          type: string
          minLength: 2
          maxLength: 80
        source:
          type: string
          minLength: 2
          maxLength: 120
        marketingConsent:
          type: boolean
        consentTextVersion:
          type: string
          pattern: '^[a-z0-9-]{3,60}$'
    EarlyAccessResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REGISTERED]
    SessionContext:
      type: object
      required: [userId, displayName, organizationId, organizationName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          type: string
          enum: [OWNER, NUTRITIONIST]
    PatientSummary:
      type: object
      required: [id, displayName, relationshipStatus]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        relationshipStatus:
          type: string
          enum: [INVITED, ACTIVE, PAUSED, ARCHIVED]
    PatientListItem:
      type: object
      required: [id, displayName, relationshipStatus, relationshipCreatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        contactEmail:
          type: [string, 'null']
          format: email
        careFocus:
          type: [string, 'null']
        relationshipStatus:
          type: string
          enum: [INVITED, ACTIVE, PAUSED, ARCHIVED]
        relationshipCreatedAt:
          type: string
          format: date-time
    PatientClinicalRecord:
      type: object
      additionalProperties: false
      required: [patientId, displayName, contactEmail, careFocus, relationshipStatus, intake, consultation]
      properties:
        patientId:
          type: string
          format: uuid
        displayName:
          type: string
        contactEmail:
          type: [string, 'null']
          format: email
        careFocus:
          type: [string, 'null']
        relationshipStatus:
          type: string
          enum: [ACTIVE]
        intake:
          oneOf:
            - $ref: '#/components/schemas/PatientIntakeRecord'
            - type: 'null'
        consultation:
          oneOf:
            - $ref: '#/components/schemas/ConsultationWorkspace'
            - type: 'null'
    PatientIntakeRecord:
      type: object
      additionalProperties: false
      required: [allergies, foodRestrictions, clinicalHistory, routineNotes, careGoal, version, updatedAt]
      properties:
        allergies:
          type: string
        foodRestrictions:
          type: string
        clinicalHistory:
          type: string
        routineNotes:
          type: string
        careGoal:
          type: string
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    UpdatePatientIntakeRequest:
      type: object
      additionalProperties: false
      required: [allergies, foodRestrictions, clinicalHistory, routineNotes, careGoal]
      properties:
        allergies:
          type: string
          maxLength: 2000
        foodRestrictions:
          type: string
          maxLength: 2000
        clinicalHistory:
          type: string
          maxLength: 5000
        routineNotes:
          type: string
          maxLength: 5000
        careGoal:
          type: string
          maxLength: 2000
    ConsultationWorkspace:
      type: object
      additionalProperties: false
      required: [id, status, createdAt, finalizedAt, note]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS, FINALIZED]
        createdAt:
          type: string
          format: date-time
        finalizedAt:
          type: [string, 'null']
          format: date-time
        note:
          $ref: '#/components/schemas/ClinicalNoteRecord'
    ClinicalNoteRecord:
      type: object
      additionalProperties: false
      required: [id, version, status, subjective, objective, assessment, agreedActions, amendmentReason, updatedAt, finalizedAt]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [DRAFT, FINALIZED]
        subjective:
          type: string
        objective:
          type: string
        assessment:
          type: string
        agreedActions:
          type: string
        amendmentReason:
          type: [string, 'null']
        updatedAt:
          type: string
          format: date-time
        finalizedAt:
          type: [string, 'null']
          format: date-time
    UpdateClinicalNoteRequest:
      type: object
      additionalProperties: false
      required: [subjective, objective, assessment, agreedActions]
      properties:
        subjective:
          type: string
          maxLength: 10000
        objective:
          type: string
          maxLength: 10000
        assessment:
          type: string
          maxLength: 10000
        agreedActions:
          type: string
          maxLength: 10000
    CreateAmendmentRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
    CreatePatientInvitationRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        careFocus:
          type: [string, 'null']
          maxLength: 120
    PatientInvitationCreated:
      type: object
      required: [invitationId, patientId, token, status, expiresAt]
      properties:
        invitationId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        token:
          type: string
        status:
          type: string
          enum: [PENDING]
        expiresAt:
          type: string
          format: date-time
    PatientInvitationPreview:
      type: object
      required: [organizationName, patientDisplayName, maskedEmail, status, expiresAt, consentTextVersion, consentText]
      properties:
        organizationName:
          type: string
        patientDisplayName:
          type: string
        maskedEmail:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
        consentTextVersion:
          type: string
          enum: [care-relationship-v1]
        consentText:
          type: string
    PatientInvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [consentTextVersion]
      properties:
        consentTextVersion:
          type: string
          enum: [care-relationship-v1]
    PatientInvitationAcceptanceResponse:
      type: object
      required: [patientId, relationshipStatus, acceptedAt]
      properties:
        patientId:
          type: string
          format: uuid
        relationshipStatus:
          type: string
          enum: [ACTIVE]
        acceptedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
