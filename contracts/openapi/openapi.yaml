openapi: 3.1.0
info:
  title: Nutrition Platform API
  version: 0.1.0
  description: Versioned REST contract for the Brazil-first nutrition practice platform.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Acquisition
  - name: Identity
  - name: Patients
  - name: Patient Invitations
paths:
  /api/v1/public/early-access:
    post:
      tags: [Acquisition]
      operationId: requestEarlyAccess
      summary: Register a professional for founder-led early access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EarlyAccessRequest'
      responses:
        '201':
          description: Interest registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EarlyAccessResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
  /api/v1/me/context:
    get:
      tags: [Identity]
      operationId: getSessionContext
      summary: Resolve the authenticated user and active organization membership
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Resolved session context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/patients/{patientId}:
    get:
      tags: [Patients]
      operationId: getPatientSummary
      summary: Return a patient only when the authenticated membership has a relationship
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization-scoped patient summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummary'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: List patients within the authenticated professional's resolved Organization
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization-scoped patient list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientListItem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /api/v1/patient-invitations:
    post:
      tags: [Patient Invitations]
      operationId: createPatientInvitation
      summary: Create an Organization-scoped patient invitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientInvitationRequest'
      responses:
        '201':
          description: Invitation created; the raw capability token is returned once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationCreated'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/v1/public/patient-invitations/{token}:
    get:
      tags: [Patient Invitations]
      operationId: getPatientInvitationPreview
      summary: Preview a patient invitation without exposing its full email address
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationPreview'
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/patient-invitations/{token}/accept:
    post:
      tags: [Patient Invitations]
      operationId: acceptPatientInvitation
      summary: Accept an invitation using the authenticated patient's verified email
      security:
        - bearerAuth: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientInvitationAcceptanceRequest'
      responses:
        '200':
          description: Care relationship activated and consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInvitationAcceptanceResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Problem:
      description: Request failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EarlyAccessRequest:
      type: object
      additionalProperties: false
      required: [name, email, currentTool, source, marketingConsent, consentTextVersion]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        currentTool:
          type: string
          minLength: 2
          maxLength: 80
        source:
          type: string
          minLength: 2
          maxLength: 120
        marketingConsent:
          type: boolean
        consentTextVersion:
          type: string
          pattern: '^[a-z0-9-]{3,60}$'
    EarlyAccessResponse:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REGISTERED]
    SessionContext:
      type: object
      required: [userId, displayName, organizationId, organizationName, role]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          type: string
          enum: [OWNER, NUTRITIONIST]
    PatientSummary:
      type: object
      required: [id, displayName, relationshipStatus]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        relationshipStatus:
          type: string
          enum: [INVITED, ACTIVE, PAUSED, ARCHIVED]
    PatientListItem:
      type: object
      required: [id, displayName, relationshipStatus, relationshipCreatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        contactEmail:
          type: [string, 'null']
          format: email
        careFocus:
          type: [string, 'null']
        relationshipStatus:
          type: string
          enum: [INVITED, ACTIVE, PAUSED, ARCHIVED]
        relationshipCreatedAt:
          type: string
          format: date-time
    CreatePatientInvitationRequest:
      type: object
      additionalProperties: false
      required: [displayName, email]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 254
        careFocus:
          type: [string, 'null']
          maxLength: 120
    PatientInvitationCreated:
      type: object
      required: [invitationId, patientId, token, status, expiresAt]
      properties:
        invitationId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        token:
          type: string
        status:
          type: string
          enum: [PENDING]
        expiresAt:
          type: string
          format: date-time
    PatientInvitationPreview:
      type: object
      required: [organizationName, patientDisplayName, maskedEmail, status, expiresAt]
      properties:
        organizationName:
          type: string
        patientDisplayName:
          type: string
        maskedEmail:
          type: string
        status:
          type: string
          enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
        expiresAt:
          type: string
          format: date-time
    PatientInvitationAcceptanceRequest:
      type: object
      additionalProperties: false
      required: [consentTextVersion]
      properties:
        consentTextVersion:
          type: string
          pattern: '^[a-z0-9-]{3,60}$'
    PatientInvitationAcceptanceResponse:
      type: object
      required: [patientId, relationshipStatus, acceptedAt]
      properties:
        patientId:
          type: string
          format: uuid
        relationshipStatus:
          type: string
          enum: [ACTIVE]
        acceptedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
