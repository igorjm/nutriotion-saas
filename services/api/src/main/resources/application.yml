spring:
  application:
    name: nutrition-platform-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nutrition_platform}
    username: ${DATABASE_USERNAME:nutrition}
    password: ${DATABASE_PASSWORD:nutrition_local_only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

app:
  web-allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    oidc-audience: ${OIDC_AUDIENCE:authenticated}
