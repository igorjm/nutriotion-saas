app = "replace-with-api-app-name"
primary_region = "gru"

[build]
  dockerfile = "../../services/api/Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "production"
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "25s"
    method = "GET"
    path = "/actuator/health/readiness"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
